services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pizzablitz
      POSTGRES_PASSWORD: set-a-local-password
      POSTGRES_DB: pizzablitz
    volumes:
      - pizzablitz-pg:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://pizzablitz:set-a-local-password@postgres:5432/pizzablitz
      CLIENT_ORIGIN: http://localhost
      DATA_DIR: ../data
      ADMIN_EMAIL: admin@pizzablitz.local
      ADMIN_PASSWORD: set-a-local-password
      SECURE_COOKIES: "false"
      PORT: 4000
    depends_on:
      - postgres

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      BACKEND_URL: http://api:4000
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

  nginx-https:
    profiles: ["https"]
    image: nginx:1.27-alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - api
      - web

  certbot:
    profiles: ["https"]
    image: certbot/certbot
    volumes:
      - certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $$!; done"

volumes:
  pizzablitz-pg:
  certs:
  certbot-www:
